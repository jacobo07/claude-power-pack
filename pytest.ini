[pytest]
# import-mode=importlib -- required, not stylistic.
#
# Under the default `prepend` mode pytest derives a test module's import name
# from its basename and inserts its directory on sys.path. This repository has
# five `test_v_block.py` and two `test_closed_loop.py` under modules/*, and two
# of the directories holding them (`arch-decision`, `code-review`) are hyphenated,
# so they cannot form a dotted package name however many __init__.py files they
# carry. pytest fell back to the bare basename, `modules/arch-decision` claimed
# the global `test_v_block` slot first, and `modules/code-review` then failed
# collection with "import file mismatch" -- an error about neither file, only
# about the order they were reached in.
#
# importlib mode derives a unique module name from the full path and does not
# mutate sys.path, so identical basenames stop competing. Measured 2026-08-06:
# collection errors 4 -> 2, tests collected unchanged at 340.
#
# It does NOT fix the remaining two (deployment, rollback). Those come from the
# modules' OWN sys.path inserts colliding on flat sibling names -- `detectors`
# exists in both deployment/ and auto-testing/, `runners` in deployment/,
# rollback/ AND backup/ -- and no import mode can repair a name that means three
# different things in one process. Those are fixed at their source.
addopts = --import-mode=importlib
