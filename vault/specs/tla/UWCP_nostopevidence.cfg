    FenceAtResource = TRUE
    RefuseEndedReceipt = TRUE
    UnknownIsNotLost = TRUE
    SuccessorNeedsStopEvidence = FALSE
    BoundExists = TRUE
    CancelAbsorbing = TRUE
INVARIANTS TypeOK StaleFenceCannotAdvance ReceiptOnlyForOpenEpoch AtMostOneOpenEpoch AtMostOneLiveExecutor
PROPERTIES CancelledNeverResumes FenceMonotonic EndedIsTerminal DispatchingResolves EveryRunningEpochEndsOrBlocks