schema = 1

[project]
name = "synthetic"
description = "Original synthetic C/C++ corpus for the public Reconstruction Factory (no derived content)."

[toolchain]
adapter = "gcc-ppc"
cc = ["powerpc-eabi-gcc", "/opt/devkitpro/devkitPPC/bin/powerpc-eabi-gcc", "powerpc-linux-gnu-gcc"]
cxx = ["powerpc-eabi-g++", "/opt/devkitpro/devkitPPC/bin/powerpc-eabi-g++"]
objdump = ["powerpc-eabi-objdump", "/opt/devkitpro/devkitPPC/bin/powerpc-eabi-objdump", "powerpc-linux-gnu-objdump"]

[toolchain.recipe.o0]
flags = ["-O0", "-ffunction-sections", "-fno-common", "-fno-asynchronous-unwind-tables"]
lang_flags = { cxx = ["-fno-exceptions", "-fno-rtti"] }

[toolchain.recipe.o1]
flags = ["-O1", "-ffunction-sections", "-fno-common", "-fno-asynchronous-unwind-tables"]
lang_flags = { cxx = ["-fno-exceptions", "-fno-rtti"] }

# Build Twin alternatives: one edit at a time from a pinned recipe
[toolchain.variant.o0_to_o1]
base = "o0"
drop = ["-O0"]
add = ["-O1"]

[toolchain.variant.o0_to_o2]
base = "o0"
drop = ["-O0"]
add = ["-O2"]

[toolchain.variant.o0_to_os]
base = "o0"
drop = ["-O0"]
add = ["-Os"]

[toolchain.variant.o0_sdata0]
base = "o0"
add = ["-msdata=none"]

[toolchain.variant.o0_sdata_eabi]
base = "o0"
add = ["-msdata=eabi"]

[toolchain.variant.o1_to_o2]
base = "o1"
drop = ["-O1"]
add = ["-O2"]

[toolchain.variant.o1_to_o0]
base = "o1"
drop = ["-O1"]
add = ["-O0"]

[corpus]
include = ["ctx"]
ref_dir = "src/ref"
skeleton_dir = "src/skeleton"
mutant_dir = "src/mutants"
heldout_dir = "src/heldout"
heldout_seal = "heldout.seal.json"

